blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/jddunn/wunderland-sh/security/policy
    about: Report it privately as the security policy describes. Do not open a public issue.
  - name: Ask a question
    url: https://wilds.ai/discord
    about: Questions and discussion happen on Discord.
  - name: Read the documentation
    url: https://docs.wunderland.sh
    about: Guides and reference for wunderland.
  - name: Report a bug in the CLI or the framework
    url: https://github.com/jddunn/wunderland/issues/new/choose
    about: Bugs in the wunderland package belong in its repository.
  - name: Report a problem with a documentation page
    url: https://github.com/jddunn/wunderland-live-docs/issues/new/choose
    about: Pages on docs.wunderland.sh are built from the wunderland-live-docs repository.
